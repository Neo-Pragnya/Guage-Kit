[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "guage-kit"
dynamic = ["version"]
description = "Evaluate LLMs, RAG, retrieval, classifiers and agents: 167 metrics, LLM judges, confidence intervals, paired tests, CI gates and offline HTML reports."
# Generated from README.md by scripts/pypi_readme.py (absolute links, images served from GitHub Pages).
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Neo Pragnya" }]
keywords = [
  "llm-evaluation",
  "rag-evaluation",
  "agent-evaluation",
  "llm-as-a-judge",
  "retrieval",
  "embeddings",
  "metrics",
  "quality-gates",
  "pytest",
  "ananke",
  "statistical-significance",
  "bootstrap",
  "ci-cd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Framework :: Pytest",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Guage Kit is a client of Ananke Plexus: Ananke owns the canonical eval models, agent-trace evaluators, gate
# decisions and evidence bundles (docs/concepts/architecture.md). Keep this range in step with SUPPORTED_ANANKE in
# src/guage_kit/harness/negotiation.py (tests/test_packaging.py checks it).
# Every runtime dependency is permissively licensed (scripts/check_licenses.py enforces it).
dependencies = [
  "ananke-plexus>=0.3.45,<0.4",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "rich>=13",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
# Neural similarity (embedding cosine, BERTScore-style matching). Apache-2.0.
embeddings = ["sentence-transformers>=3"]
# Full JSON Schema validation (the built-in validator covers the common subset). MIT.
jsonschema = ["jsonschema>=4.23"]
# Claude judges and targets through the official Anthropic SDK. Apache-2.0.
anthropic = ["anthropic>=2"]
# Amazon Bedrock judges and targets. Apache-2.0.
bedrock = ["boto3>=1.34"]
all = ["guage-kit[anthropic,embeddings,jsonschema,bedrock]"]
dev = [
  "hatchling>=1.26",
  "mypy>=1.15",
  "pytest>=8",
  "pytest-bdd>=9.0.1",
  "pytest-cov>=6",
  "pytest-xdist>=3",
  "ruff>=0.12",
  "types-pyyaml>=6",
  # reference implementations, used only as test oracles (all permissive: Apache-2.0 / BSD-3-Clause)
  "sacrebleu>=2.4",
  "rouge-score>=0.1.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[project.scripts]
guage = "guage_kit.cli:main"
guage-kit = "guage_kit.cli:main"

[project.entry-points.pytest11]
guage_kit = "guage_kit.pytest_plugin"

[project.urls]
Homepage = "https://neo-pragnya.github.io/Guage-Kit/"
Documentation = "https://neo-pragnya.github.io/Guage-Kit/docs/"
Repository = "https://github.com/Neo-Pragnya/Guage-Kit"
Issues = "https://github.com/Neo-Pragnya/Guage-Kit/issues"
Changelog = "https://github.com/Neo-Pragnya/Guage-Kit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/guage_kit/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/guage_kit"]  # includes reports/assets and the demo datasets
# 2.4 is the newest metadata most SCA parsers read; 2.5 made firewalls see an unknown component
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# Anchored: an unanchored "src" also matches website/node_modules/*/src.
include = ["/src", "/README.md", "/README.pypi.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["website", "acceptance/harness.py", "scripts/scan_dist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]  # B008: Typer defaults; E501: ruff format owns line length; RUF00x: typographic dashes and signs in prose are deliberate

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607", "S311", "S108", "S314"]
"acceptance/**/*.py" = ["S101", "S603", "S607", "S108"]
# S311: seeded random.Random drives bootstrap resampling and perturbations, never crypto
"src/guage_kit/stats/*.py" = ["S311"]
"src/guage_kit/probes/*.py" = ["S311"]
"src/guage_kit/core/dataset.py" = ["S311"]
"src/guage_kit/synth/*.py" = ["S311"]
"src/guage_kit/metrics/embeddings.py" = ["S311"]
"src/guage_kit/runner/compare.py" = ["S311"]
# S603/S607: the git revision is read with a fixed argv (no shell, no input), like any developer tool
"src/guage_kit/runner/evaluate.py" = ["S311", "S603", "S607"]
"src/guage_kit/demo.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/guage_kit"]

[[tool.mypy.overrides]]
module = ["ananke.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "sentence_transformers", "sentence_transformers.*", "jsonschema", "jsonschema.*", "boto3", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/guage_kit"]
branch = true

[tool.coverage.report]
show_missing = true

# scripts/pypi_readme.py: README.md → README.pypi.md (the PyPI long description). assets/readme/ is published on the
# docs site at /readme/ (docs-site.yml), because PyPI shows an SVG only when it is served as image/svg+xml.
[tool.pypi-readme]
repo = "https://github.com/Neo-Pragnya/Guage-Kit"
site = "https://neo-pragnya.github.io/Guage-Kit"
src = "README.md"
dst = "README.pypi.md"
branch = "main"
map = { "assets/readme/" = "readme/" }
