203.6" fill="#e6eeeb">guage init</text><g class="c3" transform="translate(101.2 0)"><rect x="57.2" y="190.1" width="109.2" height="21.9" fill="#0b1418"/><rect class="k3" x="57.2" y="191.1" width="7.3" height="16.5" fill="#f59e0b" opacity="0"/></g></g><text class="o4" x="42" y="225.5" fill="#5eead4">✓ wrote guage.yaml</text><text class="o5" x="42" y="247.4" fill="#5eead4">✓ wrote data/sample.jsonl</text><text class="o6" x="42" y="269.2" fill="#8fa1a7">Next: guage run  (then open reports/guage-report.html)</text><g class="p8"><text x="42" y="313.0" fill="#f59e0b" font-weight="700">$</text><text x="58.2" y="313.0" fill="#e6eeeb">guage run</text><g class="c8" transform="translate(93.1 0)"><rect x="57.2" y="299.5" width="101.1" height="21.9" fill="#0b1418"/><rect class="k8" x="57.2" y="300.5" width="7.3" height="16.5" fill="#f59e0b" opacity="0"/></g></g><text class="o9" x="42" y="334.8" fill="#8fa1a7">my-evaluation · 12 samples</text><text class="o10" x="42" y="356.7" fill="#8fa1a7"> metric                  value   95% CI           n</text><text class="o11" x="42" y="378.6" fill="#e6eeeb"> faithfulness ↑          0.750   0.500 – 1.000   12</text><text class="o12" x="42" y="400.4" fill="#e6eeeb"> recall@5 ↑              1.000   1.000 – 1.000   12</text><text class="o13" x="42" y="422.3" fill="#e6eeeb"> ndcg@10 ↑               0.782   0.631 – 0.922   12</text><text class="o14" x="42" y="444.2" fill="#e6eeeb"> answer_correctness ↑    0.792   0.542 – 1.000   12</text><text class="o15" x="42" y="466.1" fill="#e6eeeb"> pii_leakage ↓           0.000   0.000 – 0.000   12</text><text class="o16" x="42" y="487.9" fill="#e6eeeb"> latency_p95 ↓         786.695   733.456 – 793.900   12</text><text class="o17" x="42" y="509.8" fill="#8fa1a7"> … 16 more metrics</text><text class="o18" x="42" y="531.7" fill="#5eead4">Gate: PASS</text><text class="o19" x="42" y="553.5" fill="#5eead4">  ✓ faithfulness: 0.75 meets ≥ 0.7</text><text class="o20" x="42" y="575.4" fill="#5eead4">  ✓ recall@5: 1 meets ≥ 0.8</text><text class="o21" x="42" y="597.3" fill="#f59e0b">html: reports/guage-report.html</text><text class="o22" x="42" y="619.1" fill="#8fa1a7">junit: reports/guage-junit.xml</text><text class="o23" x="42" y="641.0" fill="#8fa1a7">markdown: reports/guage-summary.md</text></g></g><g class="s0"><rect x="742" y="92.0" width="434" height="117.2" rx="10" fill="#12232a" stroke="#22383c"/><rect class="n0" x="742" y="92.0" width="4" height="117.2" rx="2" fill="#f59e0b"/><circle cx="768" cy="116.0" r="12" fill="none" stroke="#f59e0b" stroke-width="1.6"/><text x="768" y="120.5" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">1</text><text x="790" y="121.0" fill="#ffffff" font-size="14" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Install</text><text x="790" y="139.0" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">One package from PyPI. No model, account or network</text><text x="790" y="154.0" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">needed to start.</text><g class="t0"><circle cx="1156" cy="114.0" r="9" fill="#5eead4"/><path d="M1151.5 114.0 l3.2 3.4 l6 -6.6" fill="none" stroke="#0b1418" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><style>.t0{transform-box:fill-box;transform-origin:center}</style><g class="s1"><rect x="742" y="219.2" width="434" height="117.2" rx="10" fill="#12232a" stroke="#22383c"/><rect class="n1" x="742" y="219.2" width="4" height="117.2" rx="2" fill="#f59e0b"/><circle cx="768" cy="243.2" r="12" fill="none" stroke="#f59e0b" stroke-width="1.6"/><text x="768" y="247.7" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">2</text><text x="790" y="248.2" fill="#ffffff" font-size="14" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Scaffold</text><text x="790" y="266.2" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">A starter guage.yaml and a sample dataset. Never</text><text x="790" y="281.2" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">overwrites.</text><g class="t1"><circle cx="1156" cy="241.2" r="9" fill="#5eead4"/><path d="M1151.5 241.2 l3.2 3.4 l6 -6.6" fill="none" stroke="#0b1418" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><style>.t1{transform-box:fill-box;transform-origin:center}</style><g class="s2"><rect x="742" y="346.4" width="434" height="117.2" rx="10" fill="#12232a" stroke="#22383c"/><rect class="n2" x="742" y="346.4" width="4" height="117.2" rx="2" fill="#f59e0b"/><circle cx="768" cy="370.4" r="12" fill="none" stroke="#f59e0b" stroke-width="1.6"/><text x="768" y="374.9" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">3</text><text x="790" y="375.4" fill="#ffffff" font-size="14" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Evaluate</text><text x="790" y="393.4" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Metrics chosen from the fields you have, each with a</text><text x="790" y="408.4" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">bootstrap interval.</text><g class="t2"><circle cx="1156" cy="368.4" r="9" fill="#5eead4"/><path d="M1151.5 368.4 l3.2 3.4 l6 -6.6" fill="none" stroke="#0b1418" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><style>.t2{transform-box:fill-box;transform-origin:center}</style><g class="s3"><rect x="742" y="473.6" width="434" height="117.2" rx="10" fill="#12232a" stroke="#22383c"/><rect class="n3" x="742" y="473.6" width="4" height="117.2" rx="2" fill="#f59e0b"/><circle cx="768" cy="497.6" r="12" fill="none" stroke="#f59e0b" stroke-width="1.6"/><text x="768" y="502.1" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">4</text><text x="790" y="502.6" fill="#ffffff" font-size="14" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Gate</text><text x="790" y="520.6" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Rules decided by Ananke Plexus: PASS, WARN, REVIEW or</text><text x="790" y="535.6" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">BLOCK, with an exit code.</text><g class="t3"><circle cx="1156" cy="495.6" r="9" fill="#5eead4"/><path d="M1151.5 495.6 l3.2 3.4 l6 -6.6" fill="none" stroke="#0b1418" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><style>.t3{transform-box:fill-box;transform-origin:center}</style><g class="s4"><rect x="742" y="600.8" width="434" height="117.2" rx="10" fill="#12232a" stroke="#22383c"/><rect class="n4" x="742" y="600.8" width="4" height="117.2" rx="2" fill="#f59e0b"/><circle cx="768" cy="624.8" r="12" fill="none" stroke="#f59e0b" stroke-width="1.6"/><text x="768" y="629.3" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">5</text><text x="790" y="629.8" fill="#ffffff" font-size="14" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Report</text><text x="790" y="647.8" fill="#8fa1a7" font-size="11.5" font-family="Inter,ui-sans-seri